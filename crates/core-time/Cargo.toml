# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "orchestra-core-time"
description = "Exact rational musical time, the tempo map and conversions to samples and video frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Allowed internal dependencies are listed in docs/ARCHITECTURE.md (only "downwards").
[dependencies]

# Test-only tools (ADR-0016): property tests and the allocation counter. Never shipped.
[dev-dependencies]
orchestra-test-support.workspace = true
proptest.workspace = true
gungraun.workspace = true

# Instruction-count benchmarks of the rational type (ADR-0016 §1, SCALETTA F1.03b). Gungraun
# replaces the default libtest benchmark harness with its own `main!`.
[[bench]]
name = "rational"
harness = false

# Instruction-count benchmarks of the meter map lookups and of one edit (SCALETTA F1.04b).
[[bench]]
name = "meter_map"
harness = false

[lints]
workspace = true
