# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "orchestra-ui"
description = "The user interface: notation view, DAW view and video view as projections of one model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Allowed internal dependencies are listed in docs/ARCHITECTURE.md (only "downwards").
[dependencies]
orchestra-core-time.workspace = true
orchestra-core-model.workspace = true
orchestra-playback.workspace = true
orchestra-notation-layout.workspace = true
orchestra-i18n.workspace = true
orchestra-video.workspace = true
# Fonts, shaping, measuring and glyph outlines (ADR-0044): the renderer rasterises glyphs from
# its outlines into the glyph cache, and glyph runs carry its face and glyph types.
orchestra-text.workspace = true
# The accessibility tree (ADR-0045 WA5): one node per widget, the window's adapter.
accesskit.workspace = true
accesskit_winit.workspace = true
# The system clipboard, behind `platform::clipboard::ClipboardSource` (ADR-0047 TF12).
arboard.workspace = true
# The system's file choosers, behind `platform::file_chooser` (ADR-0050 DG4, F2.12a5a).
rfd.workspace = true
# The CPU backend of the drawing abstraction (ADR-0039 D9), on every platform.
tiny-skia.workspace = true
# The window, the event loop, input, and presenting pixels (ADR-0040), on every platform.
winit.workspace = true
softbuffer.workspace = true

# Reading the system's light/dark preference from the XDG desktop portal (ADR-0038 S2). Linux
# only: on Windows and macOS the preference comes from `winit` (ADR-0038 S3, step F2.04).
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures-lite.workspace = true
# The probe of the Wayland compositor's decorations (ADR-0049 TB2, F2.11b2), Linux only.
wayland-client.workspace = true
wayland-protocols.workspace = true

# The system menu bar on macOS (ADR-0036 B5, ADR-0048 AM9, F2.11e1): never compiled elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[dev-dependencies]
# Allocation-counting allocator for the "reading a theme never allocates" test (ADR-0016),
# test-only.
orchestra-test-support.workspace = true
proptest.workspace = true
# Instruction-count benchmarks of the drawing abstraction (ADR-0016, ADR-0039 D10).
gungraun.workspace = true
# Reads the accessibility tree as AccessKit's adapters do, for the text field's tests (F2.10b3).
accesskit_consumer.workspace = true

# Instruction-count benchmarks of recording and drawing the reference scene (ADR-0039 D10,
# SCALETTA F2.03).
[[bench]]
name = "draw"
harness = false

# Instruction-count benchmarks of the widgets' core (ADR-0045, SCALETTA F2.09a).
[[bench]]
name = "widgets"
harness = false

# The system's menu built for real with `muda` on macOS's main thread (F2.11e1): its own `main`,
# because `AppKit`'s menus cannot be made on the test harness's threads.
[[test]]
name = "system_menu_macos"
harness = false

[lints]
workspace = true
