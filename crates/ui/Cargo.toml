# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "orchestra-ui"
description = "The user interface: notation view, DAW view and video view as projections of one model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Allowed internal dependencies are listed in docs/ARCHITECTURE.md (only "downwards").
[dependencies]
orchestra-core-time.workspace = true
orchestra-core-model.workspace = true
orchestra-playback.workspace = true
orchestra-notation-layout.workspace = true
orchestra-i18n.workspace = true
orchestra-video.workspace = true
# The CPU backend of the drawing abstraction (ADR-0039 D9), on every platform.
tiny-skia.workspace = true
# The window, the event loop, input, and presenting pixels (ADR-0040), on every platform.
winit.workspace = true
softbuffer.workspace = true

# Reading the system's light/dark preference from the XDG desktop portal (ADR-0038 S2). Linux
# only: on Windows and macOS the preference comes from `winit` (ADR-0038 S3, step F2.04).
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures-lite.workspace = true

[dev-dependencies]
# Allocation-counting allocator for the "reading a theme never allocates" test (ADR-0016),
# test-only.
orchestra-test-support.workspace = true
proptest.workspace = true
# Instruction-count benchmarks of the drawing abstraction (ADR-0016, ADR-0039 D10).
gungraun.workspace = true

# Instruction-count benchmarks of recording and drawing the reference scene (ADR-0039 D10,
# SCALETTA F2.03).
[[bench]]
name = "draw"
harness = false

[lints]
workspace = true
