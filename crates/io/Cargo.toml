# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "orchestra-io"
description = "Import/export: MIDI, MusicXML and the versioned project file format with migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Allowed internal dependencies are listed in docs/ARCHITECTURE.md (only "downwards").
[dependencies]
orchestra-core-time.workspace = true
orchestra-core-model.workspace = true
# The played notes that the MIDI export writes (ADR-0032 E11): downwards, no cycle.
orchestra-playback.workspace = true
# The project file (ADR-0029 S1): the schema's derives and the JSON encoding. Being a normal
# dependency, `serde_json` is also available to the tests (the golden-file test builds random
# JSON values with it): it needs no second entry under [dev-dependencies].
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The reference scores of the tests and benchmarks (ADR-0031), test-only.
orchestra-test-scores.workspace = true
# Property tests (ADR-0016): random documents saved and loaded back.
proptest.workspace = true
# Instruction-count benchmarks of saving and loading (ADR-0016, ADR-0017).
gungraun.workspace = true
# An independent MIDI file reader: the oracle of the MIDI export's tests (ADR-0032 E2).
midly.workspace = true

# Instruction-count benchmarks of saving and loading a project on the normal and heavy scores
# (SCALETTA F1.15b part 2, ADR-0029 S12).
[[bench]]
name = "project"
harness = false

# Instruction-count benchmarks of the MIDI export on the full preset (ADR-0032, SCALETTA F1.18).
[[bench]]
name = "midi"
harness = false

[lints]
workspace = true
