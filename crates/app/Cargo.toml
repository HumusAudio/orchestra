# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "orchestra-app"
description = "The Orchestra executable: wires every crate together"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p orchestra-app` starts the program, not the developer's screenshot tool (the crate
# has two binaries since ADR-0041; found by the owner on 2026-11-12, F2.09c).
default-run = "orchestra"

# Allowed internal dependencies are listed in docs/ARCHITECTURE.md (only "downwards").
[dependencies]
orchestra-core-time.workspace = true
orchestra-core-model.workspace = true
orchestra-playback.workspace = true
orchestra-notation-layout.workspace = true
orchestra-audio-engine.workspace = true
orchestra-plugin-host.workspace = true
orchestra-io.workspace = true
orchestra-i18n.workspace = true
orchestra-ui.workspace = true
# The bundled faces, created once and lent to the window and the renderers (ADR-0044 TB2).
orchestra-text.workspace = true
orchestra-video.workspace = true

[dev-dependencies]
# The demonstration's tests read the roles and names of its accessibility tree (F2.09c).
accesskit.workspace = true

[lints]
workspace = true

# The library shares the views between the two executables below (ADR-0041 S1). Not a public API:
# nothing outside this crate depends on it.
[lib]
name = "orchestra_app"
path = "src/lib.rs"

# The executable is called `orchestra` (not `orchestra-app`): that is the name users type and the
# name packagers expect.
[[bin]]
name = "orchestra"
path = "src/main.rs"

# The developer tool that renders the guides' screenshots headless (ADR-0041), run by
# `cargo xtask screenshots`. Never distributed: packaging (F6) ships `orchestra` only.
[[bin]]
name = "orchestra-screenshots"
path = "src/bin/orchestra-screenshots.rs"
