en-GB = "tie"
it = "legatura di valore"
fr = "liaison de prolongation"
de = "Haltebogen"
es = "ligadura de prolongación"
sources = ["musescore-ui", "wikipedia", "musescore-handbook-it", "musescore-glossary-es", "breitkopf-lexikon"]
note = """Every language except English uses the same base word for tie and slur and disambiguates with a \
qualifier: never shorten to 'legatura'/'liaison'/'Bogen'/'ligadura' when both exist in the UI."""
