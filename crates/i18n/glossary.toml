# ================================================================================================

[[term]]
id = "staff"
category = "notation"
en-US = "staff"
en-GB = "stave"
it = "rigo"
fr = "portée"
de = "Notenzeile"
es = "pentagrama"
plural = { en-US = "staves", en-GB = "staves", it = "righi", fr = "portées", de = "Notenzeilen", es = "pentagramas" }
sources = ["musescore-ui", "wikipedia", "wikipedia-staff", "musescore-handbook-en-gb"]
note = """en-GB: 'stave' per Wikipedia ('UK usually stave') and the MuseScore en_GB UI ('Staff' → 'Stave'); \
plural 'staves' is shared. it: the MuseScore UI uses 'rigo' (Wikipedia's article is 'Pentagramma'); \
in software 'rigo' is the usual word because a staff may have 1–5 lines (percussion), while \
'pentagramma' literally means five lines. de: MuseScore uses 'Notenzeile'; Wikipedia's 'Notensystem' \
is ambiguous with 'System' (a line of staves), so we avoid it."""
review = false

