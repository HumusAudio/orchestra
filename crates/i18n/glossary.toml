# SPDX-License-Identifier: GPL-3.0-or-later
#
# Orchestra terminology glossary (ADR-0008, docs/i18n-process.md).
#
# ONE entry per musical or technical term used in the interface. Before writing or changing any
# user-visible string, look the term up here; if it is missing, research it (music dictionaries,
# localised manuals and UI catalogues of notation/DAW software, academic glossaries) and add it.
# Musical terms are NOT translated literally: a "quarter note" is a "crotchet" in en-GB, a
# "semiminima" in Italian, a "noire" in French.
#
# Fields of each [[term]]:
#   id         stable identifier (snake_case, en-US based)
#   category   "notation" | "daw" | "general"
#   en-US, en-GB, it, fr, de, es   the chosen term (singular, lower case unless it is a noun that
#                                  is always capitalised, as in German)
#   plural     optional table with irregular/notable plurals per language
#   sources    ids from [sources] below (every entry cites at least one)
#   note       why this is the choice, especially where it is not the literal translation or
#              where sources disagree
#   review     true when sources disagree and a native-speaking musician should confirm
#
# Research performed 2026-10-28. Evidence collection method:
#   - "musescore-ui": the shipped MuseScore Studio UI translation catalogues
#     (share/locale/musescore_<lang>.ts, branch main), counting only finished translations of the
#     exact English source string. This is what musicians actually see in a notation program.
#   - "ardour-ui": Ardour DAW UI catalogues (gtk2_ardour/po/<lang>.po, branch master), non-fuzzy
#     entries only. Ardour's en_GB catalogue only overrides strings that differ from en-US
#     ("Quantise", "Colour"): evidence that the other DAW terms are identical in British English.
#   - "logic-guide": the same page id of Apple's "Logic Pro for iPad User Guide" fetched in
#     en-us/en-gb/fr-fr/de-de/es-es (the it-it pages are not translated and fall back to English).
#   - "wikipedia": interlanguage links of the English Wikipedia article (API prop=langlinks) and,
#     for British usage, the article text itself.
#   - "musescore-handbook-it", "cubase-it": Italian handbook/manual pages found by web search.

[sources]
musescore-ui = "https://github.com/musescore/MuseScore/tree/main/share/locale"
ardour-ui = "https://github.com/Ardour/ardour/tree/master/gtk2_ardour/po"
logic-guide = "https://support.apple.com/guide/logicpro-ipad/welcome/ipados (pages lpipf0998b33, lpip1093bde1, lpipd72a60da, lpipfc8ea6fc, lpip806df382, lpip9b35f249 in each locale)"
wikipedia = "https://en.wikipedia.org/w/api.php?action=query&prop=langlinks (article titles as cited in each note)"
wikipedia-staff = "https://en.wikipedia.org/wiki/Staff_(music) — 'staff (UK usually stave)', 'grand staff (American English) or great stave (British English)'"
wikipedia-note-value = "https://en.wikipedia.org/wiki/Note_value — American vs British note names"
musescore-handbook-en-gb = "https://handbook.musescore.org/en_gb/appendix/glossary — 'Staff (AE) / Stave (BE)', 'Bar (BE)', 'crotchet (BE)'"
musescore-handbook-it = "https://musescore.org/it/handbook/2/glossario — legatura di valore / legatura di portamento"
musescore-glossary-es = "https://musescore.org/es/manual/glosario — ligadura de prolongación / ligadura de expresión"
dorico-fr = "https://archive.steinberg.help/dorico_first_steps/v4/fr/Dorico_First_Steps_4_Premiers_pas_fr.pdf — 'liaison d'expression', 'chiffrage de mesure'"
cubase-it = "https://archive.steinberg.help/cubase_le/v12/it/Cubase_LE_12_Manuale_operativo_it.pdf — 'valori di trasposizione e velocity nella linea info'"
breitkopf-lexikon = "https://www.breitkopf.com/assets/pdf/BV395_70_Lexikon.pdf — Haltebogen vs Bindebogen"

