note = "The theme editor's heading over its contrast warnings (prefs-theme-readability, F2.12b1, owner's request of 2026-11-26: plain words, no ratios). WCAG's own word for the measure is 'contrast' (de 'Kontrast', es/fr 'contraste'), but its Understanding page explains it in terms of text being readable; the owner asked for a word anyone understands, so the heading names the effect, not the measure. 'Leggibilità', 'lisibilité', 'Lesbarkeit' and 'legibilidad' are the common words for how easily text can be read (es: web.dev's Spanish pages on colour contrast; de: the German WCAG 2.2 map). The warnings themselves say 'almost invisible', 'hard to read', 'hard to make out', 'not well enough for people who don't see well' in each language's ordinary words. Research 2026-11-26."
