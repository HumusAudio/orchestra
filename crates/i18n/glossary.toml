# SPDX-License-Identifier: GPL-3.0-or-later
#
# Orchestra terminology glossary (ADR-0008, docs/i18n-process.md).
#
# ONE entry per musical or technical term used in the interface. Before writing or changing any
# user-visible string, look the term up here; if it is missing, research it (music dictionaries,
# localised manuals and UI catalogues of notation/DAW software, academic glossaries) and add it.
# Musical terms are NOT translated literally: a "quarter note" is a "crotchet" in en-GB, a
# "semiminima" in Italian, a "noire" in French.
#
# Fields of each [[term]]:
#   id         stable identifier (snake_case, en-US based)
#   category   "notation" | "daw" | "general"
#   en-US, en-GB, it, fr, de, es   the chosen term (singular, lower case unless it is a noun that
#                                  is always capitalised, as in German)
#   plural     optional table with irregular/notable plurals per language
#   sources    ids from [sources] below (every entry cites at least one)
#   note       why this is the choice, especially where it is not the literal translation or
#              where sources disagree
#   review     true when sources disagree and a native-speaking musician should confirm
#
# Research performed 2026-10-28. Evidence collection method:
#   - "musescore-ui": the shipped MuseScore Studio UI translation catalogues
#     (share/locale/musescore_<lang>.ts, branch main), counting only finished translations of the
#     exact English source string. This is what musicians actually see in a notation program.
#   - "ardour-ui": Ardour DAW UI catalogues (gtk2_ardour/po/<lang>.po, branch master), non-fuzzy
#     entries only. Ardour's en_GB catalogue only overrides strings that differ from en-US
#     ("Quantise", "Colour"): evidence that the other DAW terms are identical in British English.
#   - "logic-guide": the same page id of Apple's "Logic Pro for iPad User Guide" fetched in
#     en-us/en-gb/fr-fr/de-de/es-es (the it-it pages are not translated and fall back to English).
#   - "wikipedia": interlanguage links of the English Wikipedia article (API prop=langlinks) and,
#     for British usage, the article text itself.
#   - "musescore-handbook-it", "cubase-it": Italian handbook/manual pages found by web search.

[sources]
musescore-ui = "https://github.com/musescore/MuseScore/tree/main/share/locale"
ardour-ui = "https://github.com/Ardour/ardour/tree/master/gtk2_ardour/po"
logic-guide = "https://support.apple.com/guide/logicpro-ipad/welcome/ipados (pages lpipf0998b33, lpip1093bde1, lpipd72a60da, lpipfc8ea6fc, lpip806df382, lpip9b35f249 in each locale)"
wikipedia = "https://en.wikipedia.org/w/api.php?action=query&prop=langlinks (article titles as cited in each note)"
wikipedia-staff = "https://en.wikipedia.org/wiki/Staff_(music) — 'staff (UK usually stave)', 'grand staff (American English) or great stave (British English)'"
wikipedia-note-value = "https://en.wikipedia.org/wiki/Note_value — American vs British note names"
musescore-handbook-en-gb = "https://handbook.musescore.org/en_gb/appendix/glossary — 'Staff (AE) / Stave (BE)', 'Bar (BE)', 'crotchet (BE)'"
musescore-handbook-it = "https://musescore.org/it/handbook/2/glossario — legatura di valore / legatura di portamento"
musescore-glossary-es = "https://musescore.org/es/manual/glosario — ligadura de prolongación / ligadura de expresión"
dorico-fr = "https://archive.steinberg.help/dorico_first_steps/v4/fr/Dorico_First_Steps_4_Premiers_pas_fr.pdf — 'liaison d'expression', 'chiffrage de mesure'"
cubase-it = "https://archive.steinberg.help/cubase_le/v12/it/Cubase_LE_12_Manuale_operativo_it.pdf — 'valori di trasposizione e velocity nella linea info'"
breitkopf-lexikon = "https://www.breitkopf.com/assets/pdf/BV395_70_Lexikon.pdf — Haltebogen vs Bindebogen"
logic-de-count-in = "https://support.apple.com/de-li/guide/logicpro-ipad/toc/3.3 — 'Metronom verwenden', 'Einzählfunktion verwenden' (Logic Pro for iPad, German)"
logic9-es = "https://help.apple.com/logicpro/mac/9.1.6/help/Spanish.lproj/Explorando%20Logic%20Pro%209.pdf — 'Ajuste del metrónomo y de la cuenta atrás'"
cubase-ai13-it = "https://steinberg.help/cubase_ai/v13/it/Cubase_AI_13_Manuale_operativo_it.pdf — 'Click del metronomo'"
gtk-ui = "https://gitlab.gnome.org/GNOME/gtk/-/tree/main/po — GTK 4 catalogues (de, fr, it, es, en_GB), messages with msgctxt 'keyboard label' (the names GTK writes in its menus' shortcuts)"
qt-ui = "https://github.com/qt/qttranslations/tree/dev/translations — qtbase_<lang>.ts, context QShortcut (the names Qt and KDE write in shortcuts)"
ms-shortcuts = "https://support.microsoft.com/<lang>/windows/keyboard-shortcuts-in-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec — Microsoft's localised list of Windows shortcuts (it-it, de-de, fr-fr, es-es), counted by occurrence"
firefox-l10n = "https://github.com/mozilla-l10n/firefox-l10n — <lang>/browser/browser/menubar.ftl (menu-application-*, menu-quit-mac, menu-window-*) and browserSets.ftl (window-minimize-command, window-zoom-command): Firefox's macOS application and Window menus, localised to match macOS (en-GB, it, fr, de, es-ES)"
apple-motion-window = "https://support.apple.com/<locale>/guide/motion/motn11e73786/mac — 'Window menu in Motion', Apple's own names of the Window menu's items (fr-fr, de-de, es-es; en-gb shows the en-US text; no it-it edition)"
apple-pages-settings = "https://support.apple.com/<locale>/guide/pages/tan2f9dbf1d8/mac — 'Pages > Settings' in Apple's Pages guide ('Pages > Réglages' in fr)"
omni-it = "https://support.omnigroup.com/doc-assets//OmniOutliner-Mac/OmniOutliner-Mac-v4.5.3.0/it/EPUB/xhtml/11_menucommands.xhtml — OmniOutliner's Italian manual: Window menu 'Contrai', 'Ridimensiona', 'Porta tutto in primo piano'"
gtk-window-controls = "https://gitlab.gnome.org/GNOME/gtk/-/tree/main/po — GTK 4 catalogues (it, fr, de, es, en_GB): the window buttons' names of gtk/gtkwindowcontrols.c (Close, Minimize, Maximize) and the window menu's Restore of gtk/gtkwindowhandle.c"
qt-mdi = "https://github.com/qt/qttranslations/tree/dev/translations — qtbase_<lang>.ts, context QMdiSubWindow (Minimize, Maximize, Restore, Close of Qt's window buttons)"
qt-buttons = "https://github.com/qt/qttranslations/tree/dev/translations — qtbase_<lang>.ts, context QPlatformTheme (the standard buttons of Qt's and KDE's dialogs: OK, Cancel, Close)"
firefox-about = "https://github.com/mozilla-l10n/firefox-l10n — <lang>/browser/browser/menubar.ftl (menu-about: the Help menu's About item and its access key) and aboutDialog.ftl (aboutDialog-title), en-GB, it, fr, de, es-ES"
gtk-about = "https://gitlab.gnome.org/GNOME/gtk/-/tree/main/po — GTK 4 catalogues (en_GB, it, fr, de, es): GtkAboutDialog's 'About %s', 'License', 'GNU General Public License, version 3 or later', and the font chooser's 'Font'"
gnome-settings = "https://gitlab.gnome.org/GNOME/gnome-control-center/-/tree/main/po — GNOME Settings' catalogues (it, fr, de, es, en_GB): the Appearance panel ('Appearance', 'Style')"
firefox-appearance = "https://github.com/mozilla-l10n/firefox-l10n — <lang>/browser/browser/preferences/preferences.ftl: the appearance choices of Firefox's settings (System, Light, Dark) in it, fr, de, es-ES, en-GB"
musescore-appearance = "https://github.com/musescore/MuseScore/tree/main/share/locale — musescore_<lang>.ts: the Appearance page of MuseScore Studio's Preferences ('Appearance', 'Theme', 'Follow system theme')"
musescore-preferences = "https://github.com/musescore/MuseScore/tree/main/share/locale — musescore_<lang>.ts: MuseScore Studio's Preferences ('Language', 'Keyboard', 'Shortcuts', 'Restart required')"
gtk-file-chooser = "https://gitlab.gnome.org/GNOME/gtk/-/tree/main/po — GTK 4 catalogues (it, fr, de, es, en_GB): the file chooser's question about an existing file ('A file named “%s” already exists.  Do you want to replace it?', '_Replace', '_Cancel', '_Save')"
kde-colors = "https://websvn.kde.org/trunk/l10n-kf6/ — <lang>/messages/plasma-workspace/kcm_colors.po: KDE Plasma's colour scheme roles (View/Window/Button/Selection/Tooltip Background, Normal/Inactive/Negative/Neutral/Positive Text, Focus and Hover Decoration, Accent color) in it, fr, de, es, en_GB"
gmail-density = "https://gmail.googleblog.com/2011/11/changing-information-density-in-gmails.html — Gmail's display density (Comfortable, Compact); German guide https://geekflare.com/de/gmail-settings-for-better-experience/ ('Komfortabel', 'Kompakt')"
libreoffice-shadow = "https://help.libreoffice.org/latest/en-US/text/shared/01/05210600.html — LibreOffice's Shadow page: 'Distance' (the shadow's offset) and 'Blur', in each locale's help"
typography-guru = "https://typography.guru/term/tabular-figures-r87 — tabular figures: fr 'chiffres tabulaires', de 'Tabellensatz-Ziffern' (MyFonts: 'Tabellenziffern'); no settled it/es term found"
w3c-contrast = "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html — Understanding SC 1.4.3 Contrast (Minimum): why text needs enough contrast to be readable"
web-dev-es = "https://web.dev/learn/accessibility/color-contrast/?hl=es — 'Color y contraste' (Spanish): 'legibilidad' of text and colour contrast"
intopia-de = "https://intopia.digital/wp-content/uploads/2024/05/German-WCAG-2.2-Map-by-Intopia.pdf — German WCAG 2.2 map: '1.4.3 Kontrast (Minimum)'"
musescore-articulations = "https://github.com/musescore/MuseScore/tree/main/share/locale — musescore_<lang>.ts: the articulation symbols' names ('Accent above', 'Soft accent above', 'Stress above', 'Unstress above', 'Marcato above'), 'Articulations', 'Dynamics'"

# ================================================================================================
# Notation
# ================================================================================================

[[term]]
id = "staff"
category = "notation"
en-US = "staff"
en-GB = "stave"
it = "rigo"
fr = "portée"
de = "Notenzeile"
es = "pentagrama"
plural = { en-US = "staves", en-GB = "staves", it = "righi", fr = "portées", de = "Notenzeilen", es = "pentagramas" }
sources = ["musescore-ui", "wikipedia", "wikipedia-staff", "musescore-handbook-en-gb"]
note = """en-GB: 'stave' per Wikipedia ('UK usually stave') and the MuseScore en_GB UI ('Staff' → 'Stave'); \
plural 'staves' is shared. it: the MuseScore UI uses 'rigo' (Wikipedia's article is 'Pentagramma'); \
in software 'rigo' is the usual word because a staff may have 1–5 lines (percussion), while \
'pentagramma' literally means five lines. de: MuseScore uses 'Notenzeile'; Wikipedia's 'Notensystem' \
is ambiguous with 'System' (a line of staves), so we avoid it."""
review = false

[[term]]
id = "grand_staff"
category = "notation"
en-US = "grand staff"
en-GB = "great stave"
it = "doppio rigo"
fr = "système de deux portées"
de = "Akkolade"
es = "sistema de pentagramas"
sources = ["wikipedia-staff"]
note = """en-GB 'great stave' per Wikipedia ('grand staff (American English) or great stave (British \
English)'). The other languages have no single universal term; the choices are the common \
descriptive forms and need a native musician's confirmation."""
review = true

[[term]]
id = "measure"
category = "notation"
en-US = "measure"
en-GB = "bar"
it = "battuta"
fr = "mesure"
de = "Takt"
es = "compás"
plural = { en-US = "measures", en-GB = "bars", it = "battute", fr = "mesures", de = "Takte", es = "compases" }
sources = ["musescore-ui", "wikipedia", "musescore-handbook-en-gb"]
note = """en-GB 'bar' (MuseScore en_GB translates 'Measure' → 'Bar' in all 3 occurrences). Beware: \
Wikipedia links en 'Bar (music)' to es 'Barra de compás', which is the BARLINE; the measure is \
'compás' (MuseScore es UI). it: 'battuta' is the UI term (also 'misura' in theory books)."""
review = false

[[term]]
id = "barline"
category = "notation"
en-US = "barline"
en-GB = "barline"
it = "stanghetta"
fr = "barre de mesure"
de = "Taktstrich"
es = "barra de compás"
sources = ["musescore-ui"]
note = "Same word in en-GB. Not to be confused with 'measure' (see above)."
review = false

[[term]]
id = "clef"
category = "notation"
en-US = "clef"
en-GB = "clef"
it = "chiave"
fr = "clé"
de = "Schlüssel"
es = "clave"
sources = ["musescore-ui", "wikipedia"]
note = """fr: both spellings 'clé' and 'clef' are correct (MuseScore uses 'Clef', Wikipedia 'Clef (musique)'); \
we use the modern 'clé' for consistency with general French UI conventions. de: 'Schlüssel' (UI) — \
'Notenschlüssel' where ambiguity with other keys is possible."""
review = true

[[term]]
id = "key_signature"
category = "notation"
en-US = "key signature"
en-GB = "key signature"
it = "armatura di chiave"
fr = "armure"
de = "Tonart"
es = "armadura"
sources = ["musescore-ui", "wikipedia"]
note = """de: MuseScore's UI uses 'Tonart' (literally 'key'); Wikipedia uses 'Vorzeichen (Musik)'. 'Tonart' \
is understood by every musician in a palette/menu context, but in sentences where 'key' and \
'key signature' must be distinguished use 'Tonartvorzeichnung'. it: 'armatura di chiave' (UI); \
'armatura' alone is also common."""
review = true

[[term]]
id = "time_signature"
category = "notation"
en-US = "time signature"
en-GB = "time signature"
it = "indicazione metrica"
fr = "indication de mesure"
de = "Taktart"
es = "indicación de compás"
sources = ["musescore-ui", "wikipedia", "dorico-fr"]
note = """fr: MuseScore uses 'indication de mesure', Dorico's French manual 'chiffrage de mesure'; both \
correct, we follow the more widespread UI term. es: Wikipedia's article is 'Compás (música)', but \
'compás' is our 'measure'; the UI term 'indicación de compás' avoids the clash."""
review = false

