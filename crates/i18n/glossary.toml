note = """fr: MuseScore uses 'liaison de phrasé', Dorico 'liaison d'expression'; we follow Dorico (pairs \
naturally with 'liaison de prolongation'). es: MuseScore's UI says just 'Ligadura', but its glossary \
defines 'ligadura de expresión' vs 'de prolongación'; we always qualify."""
review = true

