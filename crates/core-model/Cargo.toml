# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "orchestra-core-model"
description = "The single project document: tracks, notes (written intent + performance), commands, undo/redo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Allowed internal dependencies are listed in docs/ARCHITECTURE.md (only "downwards").
[dependencies]
orchestra-core-time.workspace = true

# Test-only tools (ADR-0016): property tests and the allocation counter. Never shipped.
[dev-dependencies]
orchestra-test-support.workspace = true
# The reference scores of the tests and benchmarks (ADR-0031), test-only.
orchestra-test-scores.workspace = true
proptest.workspace = true
gungraun.workspace = true

# Instruction-count benchmarks of the pitch operations the playback compile calls once per note
# (MIDI conversion, transposition, spelling; SCALETTA F1.07, ADR-0023).
[[bench]]
name = "pitch"
harness = false

# Instruction-count benchmarks of the skeleton lookups every event access goes through (bar ID →
# index and start position, voice by ID; SCALETTA F1.08, ADR-0022).
[[bench]]
name = "document"
harness = false

# Instruction-count benchmarks of the voices' content: metric durations, event lookup by ID, the
# clef and key in force, and the validation of a whole document (SCALETTA F1.09b, ADR-0024).
[[bench]]
name = "voice"
harness = false

# Instruction-count benchmarks of the markings: the slurs at an event, a slur by ID, the score
# order of two events, and the validation of a score with grace chords and slurs (SCALETTA F1.09c,
# ADR-0024 §5–§7).
[[bench]]
name = "marking"
harness = false

# Instruction-count benchmarks of dynamics, hairpins and tempo marks: adding a tempo mark (which
# derives the tempo map again), the tempo mark in force at a point, and the validation of a score
# with a dynamic and a hairpin in every bar (SCALETTA F1.09c, ADR-0024 §8 and §11).
[[bench]]
name = "dynamic"
harness = false

# Instruction-count benchmarks of the form: the number shown above a bar in the plain and the
# lettered numbering styles, and the validation of a score full of repeats and voltas (SCALETTA
# F1.10b, ADR-0025 §2–§3).
[[bench]]
name = "form"
harness = false

# Instruction-count benchmarks of the editor on the normal and heavy scores: entering a note and
# adding a dynamic end to end, undoing a 200-note paste, inserting and deleting a bar, a
# 1 000-update gesture (SCALETTA F1.11b part 2b, ADR-0026 §8).
[[bench]]
name = "editor"
harness = false

# Instruction-count benchmarks of the saved-document description on the normal and heavy scores:
# a document's description and a document built back from it (SCALETTA F1.15b, ADR-0029 S4).
[[bench]]
name = "parts"
harness = false

[lints]
workspace = true
