# SPDX-License-Identifier: GPL-3.0-or-later
#
# cargo-deny configuration (schema of cargo-deny 0.20, generated with `cargo deny init` on
# 2026-10-28 and then tightened). Run by `cargo xtask check` and by CI. Policy: ADR-0002.

[graph]
# Check the dependency graph for every platform we ship on, not only the host: a Windows-only or
# macOS-only dependency with a bad license must be caught on a Linux machine too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Keep the RustSec database inside `target/` (git-ignored, per checkout) instead of the default
# `$CARGO_HOME/advisory-dbs`: it works even where CARGO_HOME is read-only (sandboxed sessions) and
# `cargo clean` refreshes it. Relative paths are resolved against this file's directory.
db-path = "target/advisory-dbs"
# Known vulnerabilities and unmaintained/yanked crates (RustSec database) are errors by default in
# this schema version. Exceptions go here, each with a comment and an expiry plan.
ignore = [
    # The three crates below were merged into `zbus` itself in zbus 6, and their author published
    # "unmaintained" advisories for the separate crates. They are not vulnerabilities: a real
    # security advisory on them would still fail this check (only these three IDs are ignored).
    # They come from zbus 5.19 (ADR-0038 S2, S7), which we use because AccessKit's
    # `accesskit_unix` 0.24 does (it ignores the same advisories, AccessKit PR #834, 2026-10-18).
    # Exit: when AccessKit moves to zbus 6, we move with it in the same step and remove these.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6; we stay on zbus 5 with AccessKit (ADR-0038 S7)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6; we stay on zbus 5 with AccessKit (ADR-0038 S7)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6; we stay on zbus 5 with AccessKit (ADR-0038 S7)" },
]

[licenses]
# Only licenses compatible with distributing the whole program under GPL-3.0-or-later.
# Sources: FSF list of GPL-compatible licenses (https://www.gnu.org/licenses/license-list.html)
# and the Apache Software Foundation note on GPLv3 compatibility
# (https://www.apache.org/licenses/GPL-compatibility.html). Rationale per entry in ADR-0002.
allow = [
    "GPL-3.0-or-later",   # our own license
    "GPL-3.0-only",       # compatible: we distribute under GPLv3
    "GPL-2.0-or-later",   # "or later" lets us take it under GPLv3
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "MPL-2.0",            # compatible through its §3.3 "Secondary License" clause
    "Apache-2.0",         # compatible with GPLv3 (not with GPLv2-only)
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",        # data tables of ICU4X/unicode-* crates
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory: entries no dependency uses yet are fine.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Our own workspace crates are `publish = false`: skip them (they are GPL-3.0-or-later anyway).
ignore = true

[bans]
# Two versions of the same crate cost compile time and binary size (CLAUDE.md §5). Denied by
# default; unavoidable duplicates are listed in `skip` with a comment explaining why.
multiple-versions = "deny"
# `version = "*"` makes builds unreproducible.
wildcards = "deny"
# Path dependencies inside the workspace have no version: allow them.
allow-wildcard-paths = true
highlight = "all"
skip = [
    # syn 2 next to syn 3, build-time only (proc macros), foreseen by ADR-0036 B7. zbus 5.19
    # (ADR-0038) brings syn 2 through `enumflags2_derive` and `tracing-attributes`; the rest of the
    # tree is on syn 3. Exit: those proc macros moving to syn 3, or zbus 6 (ADR-0038 S7).
    { crate = "syn@2.0.119", reason = "build-time proc macros of zbus 5 (enumflags2_derive, tracing-attributes), ADR-0036 B7" },
    # The older copies below all come with winit 0.30 (ADR-0036 B7, ADR-0040), directly or through
    # its Linux stack (smithay-client-toolkit, calloop) and its Wayland decorations (sctk-adwaita).
    # Exit for all of them: winit 0.31, and our own title bar (F2.11b) for tiny-skia 0.11.
    { crate = "rustix@0.38.44", reason = "winit 0.30 and calloop (Linux); exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 of winit 0.30 (Linux); exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "windows-sys@0.52.0", reason = "winit 0.30 (Windows); exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "windows-sys@0.59.0", reason = "rustix 0.38 of winit 0.30's calloop; exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "objc2@0.5.3", reason = "winit 0.30 (macOS); exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "objc2-foundation@0.2.2", reason = "winit 0.30 (macOS); exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "bitflags@1.3.2", reason = "winit 0.30's macOS and Linux stack; exit: winit 0.31 (ADR-0036 B7)" },
    { crate = "getrandom@0.3.4", reason = "ahash of winit 0.30; exit: winit 0.31 (found in F2.04a, same cause as ADR-0036 B7)" },
    { crate = "thiserror@1.0.69", reason = "calloop and smithay-client-toolkit of winit 0.30 (Linux); exit: winit 0.31 (found in F2.04a)" },
    { crate = "thiserror-impl@1.0.69", reason = "the derive of thiserror 1, same as above; exit: winit 0.31" },
    { crate = "tiny-skia@0.11.4", reason = "sctk-adwaita, winit's Wayland decorations (ADR-0036 B6); exit: our title bar (F2.11b)" },
    { crate = "tiny-skia-path@0.11.4", reason = "tiny-skia 0.11 of sctk-adwaita, same as above; exit: F2.11b" },
]
skip-tree = []
deny = []

[sources]
# Only crates.io. Git dependencies or other registries need an explicit, documented exception.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
