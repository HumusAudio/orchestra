# SPDX-License-Identifier: GPL-3.0-or-later
#
# Continuous integration (ADR-0006, ADR-0009, ADR-0013).
#
# - `check` runs `cargo xtask check` (fmt, documentation and guide parity, clippy, tests including
#   translation parity, doctests, cargo-deny) on the three GitHub-hosted STANDARD runners, which are
#   free for public repositories. Larger runners are billed even for public repositories: never use
#   them here.
# - `guides` builds GUIDA.pdf and GUIDE.pdf with Typst and publishes them as an artifact (PDFs are
#   never committed). Linux only: the PDFs are byte-for-byte the same on every OS anyway, because
#   only the bundled fonts are used.
#
# Every third-party action is pinned to a full commit SHA (the tag is in the comment): a tag can be
# moved by whoever controls the action's repository, a SHA cannot. Versions checked on 2026-10-28.

name: CI

on:
  # Every branch push: a feature branch is checked before its pull request even exists, and the
  # run on the PR's head commit is what branch protection's required checks look at.
  push:
  workflow_dispatch:

# Least privilege: the jobs only read the repository (uploading artifacts needs no extra scope).
permissions:
  contents: read

# A newer push to the same branch makes older runs pointless: cancel them to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as `rust-version` in Cargo.toml: bump both together, deliberately.
  RUST_TOOLCHAIN: 1.99.1
  TYPST_VERSION: 0.15.1

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # Report every platform even if one fails: a Windows-only failure must not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Prebuilt binaries (with checksums) instead of `cargo install`: seconds instead of minutes.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest,cargo-deny

      - name: cargo xtask check
        run: cargo xtask check

  guides:
    name: guides (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: cargo xtask guides
        run: cargo xtask guides

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-guides
          path: |
            dist/GUIDA.pdf
            dist/GUIDE.pdf
          if-no-files-found: error
          # Limited retention (ADR-0009): the guides can always be rebuilt from the sources.
          retention-days: 30
