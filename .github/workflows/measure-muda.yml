# SPDX-License-Identifier: GPL-3.0-or-later
#
# TEMPORARY workflow (F2.11e1, ADR-0036 B5, CLAUDE.md §5 "every new dependency is weighed for binary
# size and build time"): a one-off measure of what `muda` costs on macOS, the only platform where it
# is compiled. It is removed again before the pull request of F2.11e1 is merged; the numbers it
# prints go into ADR-0048 and ROADMAP.md.
#
# Method: two CLEAN release builds of the `orchestra` binary on the same runner, one at the merge
# base with `main` (no `muda`, no system menu) and one at the pushed commit (with them). Both use
# their own empty target directory and no cache, so the difference in wall-clock time is the cost of
# `muda`, its new dependencies and our `platform/menu/` code together. Wall-clock times on a shared
# runner are noisy: they are only an order of magnitude. Cargo's `--timings` reports (per-crate build
# times) are uploaded as an artifact for the exact per-crate figures. The binary is measured as built
# and after `strip`, because distributed builds will be stripped.

name: measure muda (temporary)

on:
  push:
    branches: [feature/f2-11e1-muda]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as ci.yml and `rust-version` in Cargo.toml.
  RUST_TOOLCHAIN: 1.99.1
  # The merge base of feature/f2-11e1-muda with `main`: the last commit without `muda`.
  BASE_REV: 9eaf19b05b93a7a62185e32f623e24f373ade08a

jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # Full history, so that the base commit can be checked out into a worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Download every crate of both revisions first, so that network time is not counted as build
      # time in either of the two measures.
      - name: Fetch dependencies of both revisions
        shell: bash
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_REV"
          cargo fetch --locked
          (cd "$RUNNER_TEMP/base" && cargo fetch --locked)

      - name: Clean release build at the base (without muda)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/base"
          start=$(date +%s)
          cargo build --release --locked --bin orchestra --timings --target-dir "$RUNNER_TEMP/t-base"
          echo "BASE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Clean release build at the head (with muda)
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --release --locked --bin orchestra --timings --target-dir "$RUNNER_TEMP/t-head"
          echo "HEAD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Sizes as built and stripped, the crates `muda` brings in, and a summary in the job page.
      - name: Report
        shell: bash
        run: |
          size() { stat -f %z "$1"; }
          for which in base head; do
            bin="$RUNNER_TEMP/t-$which/release/orchestra"
            cp "$bin" "$RUNNER_TEMP/$which-stripped"
            strip "$RUNNER_TEMP/$which-stripped"
            echo "${which}_raw=$(size "$bin")" >> "$RUNNER_TEMP/sizes"
            echo "${which}_stripped=$(size "$RUNNER_TEMP/$which-stripped")" >> "$RUNNER_TEMP/sizes"
          done
          . "$RUNNER_TEMP/sizes"
          {
            echo "## muda on macOS (one-off measure, F2.11e1)"
            echo
            echo "| | base (no muda) | head (muda) | difference |"
            echo "|---|---|---|---|"
            echo "| clean release build, s | $BASE_SECONDS | $HEAD_SECONDS | $(( HEAD_SECONDS - BASE_SECONDS )) |"
            echo "| binary, bytes | $base_raw | $head_raw | $(( head_raw - base_raw )) |"
            echo "| stripped binary, bytes | $base_stripped | $head_stripped | $(( head_stripped - base_stripped )) |"
            echo
            echo "### Crates in the head build that the base build does not have"
            echo '```'
            (cd "$RUNNER_TEMP/base" && cargo tree --locked -e normal -p orchestra-app --prefix none | sort -u) > "$RUNNER_TEMP/tree-base"
            cargo tree --locked -e normal -p orchestra-app --prefix none | sort -u > "$RUNNER_TEMP/tree-head"
            comm -13 "$RUNNER_TEMP/tree-base" "$RUNNER_TEMP/tree-head"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/timings/base" "$RUNNER_TEMP/timings/head"
          cp "$RUNNER_TEMP"/t-base/cargo-timings/cargo-timing.html "$RUNNER_TEMP/timings/base/"
          cp "$RUNNER_TEMP"/t-head/cargo-timings/cargo-timing.html "$RUNNER_TEMP/timings/head/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muda-timings
          path: ${{ runner.temp }}/timings
