# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "gpu-render"
description = "Spike F2.06: the reference scene drawn by tiny-skia, vello_cpu, vello (wgpu) and vello_hybrid (wgpu), measured"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
vello_cpu = { version = "=0.3.0", features = ["multithreading"] }
orchestra-ui = { path = "../../crates/ui" }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
pollster = { version = "0.4", optional = true }
softbuffer = { version = "=0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
vello = { version = "=0.11.0", optional = true }
vello_hybrid = { version = "=0.2.0", optional = true }
wgpu29 = { package = "wgpu", version = "29", optional = true }
vello_common = { version = "=0.2.0", optional = true }

[features]
default = []
# The window mode (CPU backends presented with softbuffer, GPU ones with their wgpu surface).
window = ["dep:winit", "dep:softbuffer"]
gpu = ["dep:vello", "dep:pollster", "window"]
hybrid = ["dep:vello_hybrid", "dep:vello_common", "dep:wgpu29", "dep:pollster", "window"]
