# SPDX-License-Identifier: GPL-3.0-or-later
#
# Root manifest of the Orchestra Cargo workspace.
#
# Every crate lives in `crates/<name>/` (directory name = responsibility, as listed in CLAUDE.md
# §2), except the automation tool, which lives in `xtask/` by the usual cargo-xtask convention.
# Package names carry an `orchestra-` prefix (e.g. `crates/io` is the package `orchestra-io`, lib
# name `orchestra_io`): bare names like `io`, `ui` or `app` would be confusing next to `std::io`
# and would collide with existing crates.io names if we ever publish anything.
#
# The dependency rules between crates ("only downwards") are documented in docs/ARCHITECTURE.md.
# `spikes/` is deliberately NOT a member: prototypes live in their own workspace and never end up
# in release builds.

[workspace]
# Resolver "3" is the default for edition 2024; we state it explicitly so that nobody has to know
# that rule. It makes dependency resolution MSRV-aware (it prefers versions compatible with our
# `rust-version`).
resolver = "3"
members = [
    "crates/core-time",
    "crates/core-model",
    "crates/playback",
    "crates/notation-layout",
    "crates/audio-engine",
    "crates/plugin-host",
    "crates/io",
    "crates/i18n",
    "crates/ui",
    "crates/video",
    "crates/app",
    "crates/test-support",
    "crates/test-scores",
    "xtask",
]
# Evaluation prototypes have their own workspace (spikes/Cargo.toml) and must never be picked up
# by this one, not even by accident through a path dependency.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
# Edition 2024 is the newest stable edition as of rustc 1.99.1 (checked 2026-10-28 with
# `rustc --edition 2027`, which is rejected). Also mirrored in rustfmt.toml.
edition = "2024"
# Minimum supported Rust version = the toolchain we develop and test with. We bump it deliberately
# (together with the toolchain pinned in CI) instead of letting it drift.
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/HumusAudio/orchestra"
# Nothing is published to crates.io for now: this prevents an accidental `cargo publish`.
publish = false

# Internal crates, referenced by members with `orchestra-xyz.workspace = true`. Keeping the paths
# here means a crate can be moved by changing a single line.
[workspace.dependencies]
orchestra-core-time = { path = "crates/core-time" }
orchestra-core-model = { path = "crates/core-model" }
orchestra-playback = { path = "crates/playback" }
orchestra-notation-layout = { path = "crates/notation-layout" }
orchestra-audio-engine = { path = "crates/audio-engine" }
orchestra-plugin-host = { path = "crates/plugin-host" }
orchestra-io = { path = "crates/io" }
orchestra-i18n = { path = "crates/i18n" }
orchestra-ui = { path = "crates/ui" }
orchestra-video = { path = "crates/video" }
# Test-only: allowed exclusively in `[dev-dependencies]` (ADR-0016 §6, checked by `cargo xtask check`).
orchestra-test-support = { path = "crates/test-support" }
# Test-only too: the generators of the reference scores (ADR-0031 §2, same `cargo xtask check`).
orchestra-test-scores = { path = "crates/test-scores" }

# External crates. Every entry was checked on crates.io (version, license, maintenance) and is
# justified in an ADR; versions are pinned to the minor release we verified.
# Fluent (ADR-0008, verified 2026-10-28): official Project Fluent crates, Apache-2.0 OR MIT.
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
# The project file (ADR-0029 S1, verified on crates.io on 2026-11-06): `serde` for the derives of
# the file schema, `serde_json` for the encoding. Both MIT OR Apache-2.0, actively maintained, the
# most used crates of their kind; `serde_derive` brings `syn`/`quote`/`proc-macro2`, already in the
# lock file through Gungraun's macros. Only `orchestra-io` uses them (ADR-0029 S4: the model stays
# free of any serialisation dependency).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Test and benchmark tools (ADR-0016, verified 2026-10-31). Dev-dependencies only: never shipped.
# proptest: property tests with shrinking. Default features off: `fork` and `timeout` would pull in
# rusty-fork and tempfile, which we do not need; `std` keeps the regression-file persistence.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# gungraun: instruction-count benchmarks under Valgrind's Callgrind. Pinned EXACTLY (`=`) because
# the separately installed `gungraun-runner` binary must have the very same version: a silent
# `cargo update` to 0.20.1 would break `cargo xtask bench` locally and in CI. Bump it together with
# the runner version in .github/workflows/ci.yml and in the developer documentation.
gungraun = "=0.20.0"
# midly: an independent Standard MIDI File reader, the oracle of the MIDI export's tests (ADR-0032
# E2, verified on crates.io 2026-11-08: 0.5.3, Unlicense). Dev-dependency of `orchestra-io` only:
# the export writes its own bytes. Default features off (`std` only): no parallel parsing, no
# `rayon`.
midly = { version = "0.5.3", default-features = false, features = ["std"] }
# The system's light/dark preference on Linux (ADR-0038 S2, verified on crates.io on 2026-11-10).
# zbus: D-Bus in pure Rust, MIT. Pinned EXACTLY to the version AccessKit's `accesskit_unix` 0.24
# uses, with its features (`async-io`, no default features: no `blocking-api`, no tokio), so the
# two share one copy and one async stack (`cargo deny` refuses duplicates). zbus 6 exists but
# would be a second copy next to AccessKit's. Linux-only dependency of `orchestra-ui`.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
# futures-lite: `StreamExt::next` on zbus's message stream (Apache-2.0 OR MIT, 2.6.1 of 2025-08).
# Already in the tree through zbus itself, so it adds no crate. Default features keep `std`.
futures-lite = "2.6.1"

# ------------------------------------------------------------------------------------------------
# Lints shared by every library crate (`[lints] workspace = true` in each member). `xtask` is a
# developer tool, not library code, and declares its own relaxed table.
# `cargo xtask check` runs clippy with `-D warnings`, so every "warn" below is an error in CI; the
# distinction only keeps local iteration pleasant (code still compiles while you fix lints).
# ------------------------------------------------------------------------------------------------
[workspace.lints.rust]
# CLAUDE.md §4: every public item has a doc comment. Private items are covered by the clippy lint
# `missing_docs_in_private_items` below, because rustc's lint only looks at the public API.
missing_docs = "deny"
# Inside an `unsafe fn`, each unsafe operation still needs its own `unsafe {}` block (and thus its
# own `// SAFETY:` comment). Already warn-by-default in edition 2024; we make it an error.
unsafe_op_in_unsafe_fn = "deny"
# The lints below were approved by the owner on 2026-10-30 (SCALETTA F0.16, decision D01).
# `pub` on an item that is not reachable from the crate root is misleading: it looks like public
# API (which we change only deliberately, CLAUDE.md §9) but is not. Use `pub(crate)` instead.
unreachable_pub = "warn"
# `std::fmt::Display` where `fmt::Display` is already imported: needless noise.
unused_qualifications = "warn"
# Every public type implements `Debug`, so that it can appear in error messages, test failures and
# logs. A type that must not print its contents (e.g. a secret) implements it by hand.
missing_debug_implementations = "warn"
# `unsafe_code` is NOT set here: it is forbidden with `#![forbid(unsafe_code)]` in each crate's
# root, so that the three FFI crates (audio-engine, plugin-host, io) can opt out explicitly and
# visibly. A workspace-level setting cannot be overridden per crate.

[workspace.lints.clippy]
# --- Hard rules from CLAUDE.md §4 -----------------------------------------------------------------
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
# No panicking shortcuts in library code: errors are typed and propagated. Tests are exempt
# through clippy.toml (allow-unwrap-in-tests & co.).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Leftover debugging aids: warn locally, error in CI.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# --- Pedantic group: approved by the owner on 2026-10-30 (SCALETTA F0.16, decision D01) ----------
# We enable the whole `pedantic` group at low priority (so the individual entries below win) and
# silence only the lints whose noise outweighs their value for this codebase. Rationale per lint:
pedantic = { level = "warn", priority = -1 }
# Kept on purpose (listed here so the choice is visible, not accidental):
#   - cast_possible_truncation / cast_sign_loss / cast_precision_loss / cast_lossless: audio and
#     time code converts between sample counts, frame counts and floats all the time; every lossy
#     conversion must be explicit and justified. This is exactly the bug class we want to see.
#   - missing_errors_doc / missing_panics_doc: consistent with our "document everything" rule.
#   - float_cmp (a `pedantic` lint) stays on: exact comparisons of floats
#     are almost always wrong (and musical time is rational anyway, ADR-0005).
# Silenced:
#   - module_name_repetitions: types like `tempo::TempoMap` are clearer than `tempo::Map` in
#     documentation and error messages; the lint fights that naming style.
module_name_repetitions = "allow"
#   - must_use_candidate: fires on nearly every getter. We add `#[must_use]` deliberately where
#     ignoring a result is a real bug (builders, pure computations returning new values).
must_use_candidate = "allow"
#   - similar_names: DSP code legitimately uses pairs like `left`/`lefts`, `in_l`/`in_r`.
similar_names = "allow"

# --- Selected `restriction` lints: approved by the owner on 2026-10-30 (SCALETTA F0.16, D01) ------
# `restriction` is never enabled as a group (its lints contradict each other by design); each lint
# below is opted into individually, with the reason next to it.
#
# Hidden panics. They complete the "no unwrap/expect/panic! in library code" rule above, so they
# share its level ("deny"): slicing a `str` at a byte index that is not a char boundary panics,
# `v.get(i).unwrap()` is an unwrap in disguise, `unreachable!()` is a panic with another name.
string_slice = "deny"
get_unwrap = "deny"
unreachable = "deny"
# Every `#[allow(...)]` must say why (`#[allow(lint, reason = "...")]`): consistent with the rule
# "comment every choice" (CLAUDE.md §4). A silenced lint without a reason is an unexplained choice.
allow_attributes_without_reason = "warn"
# Libraries never print: output belongs to the caller (the `app` binary, a log, the UI). This also
# matters for plugin bridges, whose stdout must stay free of stray text (ADR-0011 §7). The `app`
# crate lifts these two lints explicitly in its root; `xtask` does not inherit this table.
print_stdout = "warn"
print_stderr = "warn"
# A library never ends the process (`std::process::exit` skips destructors and hides the error
# from the caller) and never leaks on purpose (`mem::forget` skips destructors too).
exit = "warn"
mem_forget = "warn"
# Two further lints are enabled only where they pay off, with crate-level attributes, because
# `[lints] workspace = true` cannot be combined with per-crate tables:
#   - indexing_slicing (`v[i]` may panic) in core-time and core-model, the crates every other
#     crate trusts; elsewhere it would be noise. Tests are exempt (clippy.toml).
#   - arithmetic_side_effects (`+ - *` may overflow) in core-time only: there every operation on
#     the rational type must follow the overflow policy of ADR-0005 §6 (designed in step F1.01).
# Rejected: the `nursery` group (lints still in development, they change between Rust releases and
# would break CI on toolchain bumps) and `as_conversions` (the pedantic `cast_*` lints already flag
# the dangerous conversions).

# ADR-0035: one codegen unit per crate in optimised builds. With Cargo's default (16 units) LLVM
# optimises each crate in 16 independent pieces, and a non-generic function is inlined across two
# pieces only when it is `#[inline]`. Which function lands in which piece depends on how the source
# files are split, so a pure refactoring could move the benchmarks by several percent (splitting
# `document.rs` made `to_parts` 6% slower with no change to the code). With one unit the optimiser
# sees the whole crate. Measured on all 97 benchmarks: 2.6% fewer instructions on average, none
# worse by more than 2.0%, a 30% smaller binary, benchmark builds no slower; a single release
# binary takes about twice as long to build. LTO was measured too and rejected (ADR-0035).
# `bench` inherits from `release`; `dev` and `test` (everyday work, `cargo xtask check`) are
# untouched.
[profile.release]
codegen-units = 1
